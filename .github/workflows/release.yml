name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        if: github.event.inputs.release_type == 'debug' || github.event_name == 'release'
        run: ./gradlew assembleDebug --stacktrace

      # TODO: Configure signing for release builds
      # - name: Build release APK
      #   if: github.event.inputs.release_type == 'release'
      #   run: ./gradlew assembleRelease --stacktrace
      #   env:
      #     SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      #     SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 90

  build-ml:
    name: Package ML Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ml/ -v || echo "No tests yet"

      - name: Package ML engine
        run: |
          mkdir -p dist
          tar -czf dist/ml-engine-${{ github.ref_name }}.tar.gz ml-engine/
          echo "ML engine packaged successfully"

      - name: Upload ML package
        uses: actions/upload-artifact@v4
        with:
          name: ml-engine-package
          path: dist/
          retention-days: 90
